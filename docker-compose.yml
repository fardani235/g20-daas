name: g20-daas

# Images are pinned by digest so a deploy is reproducible and a moved tag can
# never change what runs. Bump with `scripts/pin-images.sh` (resolves each tag
# to its current digest and rewrites this file), review the diff, commit.
#
# The Frappe image's version tag mirrors the frappe submodule
# (frappe-bench/apps/frappe); `scripts/frappe-version.sh` prints it and CI
# tags the image with it. After CI publishes a new image, re-pin here.
x-frappe-image: &frappe-image
  image: ghcr.io/fardani235/webodm-frappe:16.34.0@sha256:5caef9eed441258e1edd6ae5ff288579786300a3340e6f06d3f1e23fa573a343
  # To build locally instead of pulling from registry, uncomment below:
  # build:
  #   context: ./frappe-bench/apps
  #   dockerfile: Dockerfile
  #   additional_contexts:
  #     - sites=./frappe-bench/sites
  #     - root=.
  # Startup logic (secrets -> env, redis URLs, site config, role dispatch)
  # lives in infra/frappe/entrypoint.sh, which is the image ENTRYPOINT.

x-frappe-env-base: &frappe-env-base
  SITE_NAME: ${SITE_NAME:-webodm.local}
  DB_HOST: postgres
  DB_PORT: 5432
  DB_NAME: ${DB_NAME:-webodm}
  DB_USER: ${DB_USER:-webodm}
  # Postgres superuser Frappe's installer uses to create the app DB
  # (created by infra/postgres/init-frappe-admin.sh).
  FRAPPE_ROOT_USER: frappe_admin
  FRAPPE_ROOT_PASSWORD_FILE: /run/secrets/frappe_admin_password
  DB_PASSWORD_FILE: /run/secrets/db_password
  ADMIN_PASSWORD_FILE: /run/secrets/admin_password
  # entrypoint.sh builds FRAPPE_REDIS_CACHE/_QUEUE (auth embedded) from these.
  REDIS_CACHE_HOST: redis-cache
  REDIS_CACHE_PORT: 13000
  REDIS_QUEUE_HOST: redis-queue
  REDIS_QUEUE_PORT: 11000
  REDIS_CACHE_PASSWORD_FILE: /run/secrets/redis_cache_password
  REDIS_QUEUE_PASSWORD_FILE: /run/secrets/redis_queue_password
  GEOSPATIAL_URL: http://geospatial:5000
  # User plugin sandbox (services/plugin-runner). The sandbox dir must be the
  # same path in the worker and the runner: both mount `plugin_sandbox` there.
  PLUGIN_RUNNER_URL: http://plugin-runner:5001
  PLUGIN_SANDBOX_DIR: /sandbox
  FRAPPE_SOCKETIO_PORT: "9000"
  # --- On-demand compute (services/provisioner) ---------------------------
  # Empty PROVISIONER_URL disables it: tasks run on the static `nodeodm`
  # service exactly as before. Point it at the provisioner to provision a
  # node per task; the provisioner's own env decides the provider (AWS).
  PROVISIONER_URL: ${PROVISIONER_URL:-}
  PROVISIONER_API_TOKEN_FILE: /run/secrets/provisioner_api_token
  WEBODM_COMPUTE_MAX_INSTANCES: ${WEBODM_COMPUTE_MAX_INSTANCES:-5}
  WEBODM_COMPUTE_MAX_INSTANCES_PER_ORG: ${WEBODM_COMPUTE_MAX_INSTANCES_PER_ORG:-2}
  WEBODM_COMPUTE_PROVISION_TIMEOUT_SECONDS: ${WEBODM_COMPUTE_PROVISION_TIMEOUT_SECONDS:-900}
  WEBODM_COMPUTE_MAX_LIFETIME_SECONDS: ${WEBODM_COMPUTE_MAX_LIFETIME_SECONDS:-43200}
  # --- Object storage (webodm_core.storage) -------------------------------
  # Empty WEBODM_S3_BUCKET = host disk is the only store (previous behaviour).
  # With a bucket, S3 is canonical and private/files becomes a serving cache.
  # Credentials come from Docker secrets (the app's *writer* identity; the
  # geospatial service has a separate read/convert identity below).
  WEBODM_S3_BUCKET: ${WEBODM_S3_BUCKET:-}
  WEBODM_S3_PREFIX: ${WEBODM_S3_PREFIX:-}
  WEBODM_S3_REGION: ${WEBODM_S3_REGION:-}
  WEBODM_S3_ENDPOINT_URL: ${WEBODM_S3_ENDPOINT_URL:-}
  WEBODM_S3_FORCE_PATH_STYLE: ${WEBODM_S3_FORCE_PATH_STYLE:-0}
  WEBODM_S3_ACCESS_KEY_ID_FILE: /run/secrets/s3_app_access_key_id
  WEBODM_S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_app_secret_access_key
  WEBODM_CACHE_MAX_BYTES: ${WEBODM_CACHE_MAX_BYTES:-53687091200}
  WEBODM_CACHE_IDLE_SECONDS: ${WEBODM_CACHE_IDLE_SECONDS:-604800}

x-frappe-secrets: &frappe-secrets
  - admin_password
  - db_password
  - frappe_admin_password
  - redis_cache_password
  - redis_queue_password
  - s3_app_access_key_id
  - s3_app_secret_access_key
  - provisioner_api_token

x-frappe-volumes: &frappe-volumes
  - frappe_sites:/workspace/frappe-bench/sites
  - /workspace/frappe-bench/sites/assets
  - frappe_logs:/workspace/frappe-bench/logs
  - frappe_data:/data

services:
  caddy:
    image: ghcr.io/fardani235/webodm-caddy:2@sha256:3a38c2a00f536c1a6bacc7c7aef402987551baea9caa0184a14b096a3bdafb2c
    # build:
    #   context: ./infra/caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-${SITE_NAME:-webodm.local}}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "curl -ksSo /dev/null --max-time 5 http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  postgres:
    image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-webodm}
      POSTGRES_USER: ${DB_USER:-webodm}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    secrets:
      - db_password
      - frappe_admin_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-frappe-admin.sh:/docker-entrypoint-initdb.d/init-frappe-admin.sh:ro
    networks:
      - data
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-webodm} -d ${DB_NAME:-webodm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  redis-cache:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        exec redis-server \
          --port 13000 \
          --save "" \
          --appendonly "no" \
          --maxmemory 512mb \
          --maxmemory-policy allkeys-lru \
          --requirepass "$$(cat /run/secrets/redis_cache_password)"
    secrets:
      - redis_cache_password
    volumes:
      - redis_cache_data:/data
    networks:
      - data
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 13000 -a \"$$(cat /run/secrets/redis_cache_password)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  redis-queue:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        exec redis-server \
          --port 11000 \
          --save "" \
          --appendonly "yes" \
          --appendfsync everysec \
          --requirepass "$$(cat /run/secrets/redis_queue_password)"
    secrets:
      - redis_queue_password
    volumes:
      - redis_queue_data:/data
    networks:
      - data
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 11000 -a \"$$(cat /run/secrets/redis_queue_password)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  frappe-init:
    <<: *frappe-image
    environment:
      <<: *frappe-env-base
      FRAPPE_ROLE: init
    secrets: *frappe-secrets
    volumes:
      - frappe_sites:/workspace/frappe-bench/sites
    networks:
      - backend
      - data
    depends_on:
      postgres:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  frappe-web:
    <<: *frappe-image
    environment:
      <<: *frappe-env-base
      FRAPPE_ROLE: web
    secrets: *frappe-secrets
    volumes:
      - frappe_sites:/workspace/frappe-bench/sites
      # Anonymous volume: Docker initialises it from the image's baked assets on
      # every container (re)create, so served assets always match the image and
      # never drift from a long-lived named volume.
      - /workspace/frappe-bench/sites/assets
      - frappe_logs:/workspace/frappe-bench/logs
      - frappe_data:/data
    networks:
      - backend
      - frontend
    depends_on:
      frappe-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/method/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G

  frappe-worker:
    <<: *frappe-image
    environment:
      <<: *frappe-env-base
      FRAPPE_ROLE: worker
    secrets: *frappe-secrets
    volumes:
      - frappe_sites:/workspace/frappe-bench/sites
      - frappe_logs:/workspace/frappe-bench/logs
      - frappe_data:/data
      # Staging area for user plugin runs, shared with plugin-runner only.
      - plugin_sandbox:/sandbox
    networks:
      - backend
      - sandbox
    depends_on:
      frappe-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  frappe-scheduler:
    <<: *frappe-image
    environment:
      <<: *frappe-env-base
      FRAPPE_ROLE: scheduler
    secrets: *frappe-secrets
    volumes:
      - frappe_sites:/workspace/frappe-bench/sites
      - frappe_logs:/workspace/frappe-bench/logs
    networks:
      - backend
    depends_on:
      frappe-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  frappe-socketio:
    <<: *frappe-image
    environment:
      <<: *frappe-env-base
      FRAPPE_ROLE: socketio
    secrets: *frappe-secrets
    volumes:
      - frappe_sites:/workspace/frappe-bench/sites
      # Anonymous volume: Docker initialises it from the image's baked assets on
      # every container (re)create, so served assets always match the image and
      # never drift from a long-lived named volume.
      - /workspace/frappe-bench/sites/assets
      - frappe_logs:/workspace/frappe-bench/logs
    networks:
      - backend
      - frontend
    depends_on:
      frappe-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9000/socket.io/?EIO=4&transport=polling' | grep -q 'sid'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  geospatial:
    image: ghcr.io/fardani235/webodm-geospatial:1@sha256:bc8c1ecccbc7d4f32df4e5c68fbebdb4af35c11e78702a5ec717718017efe1d8
    # build:
    #   context: ./services/geospatial
    #   dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      # Defaults for the object-detection op. Aerial orthophotos need an
      # aerial-trained model; COCO (yolov8n) remains the code fallback.
      OBJECT_DETECTION_DEFAULT_MODEL: visdrone-yolov11s.onnx
      OBJECT_DETECTION_DEFAULT_LABELS: visdrone.txt
      # Object storage: read rasters from S3 (/vsis3/ range reads) and write
      # COGs back S3 -> S3. Same bucket as the app; its own read+convert
      # identity (least privilege: no delete, no access to inputs/ prefixes
      # is enforced by the IAM policy, see infra/aws/iam). Empty = local only.
      S3_BUCKETS: ${WEBODM_S3_BUCKET:-}
      S3_ENDPOINT_URL: ${WEBODM_S3_ENDPOINT_URL:-}
      AWS_REGION: ${WEBODM_S3_REGION:-}
      S3_FORCE_PATH_STYLE: ${WEBODM_S3_FORCE_PATH_STYLE:-}
      AWS_ACCESS_KEY_ID_FILE: /run/secrets/s3_geospatial_access_key_id
      AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_geospatial_secret_access_key
      COG_SCRATCH_DIR: /scratch
    secrets:
      - s3_geospatial_access_key_id
      - s3_geospatial_secret_access_key
    volumes:
      - frappe_data:/data
      - frappe_sites:/workspace/frappe-bench/sites
      # Container-local scratch for S3 -> S3 COG conversion; never the sites volume.
      - geospatial_scratch:/scratch
    # backend only: the service is unauthenticated and is reached exclusively
    # through the Frappe tile proxy (webodm_core.api.tiles), never from Caddy.
    networks:
      - backend
    depends_on:
      redis-cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  plugin-runner:
    # Sandbox for user-uploaded analysis plugins (services/plugin-runner).
    # No published image yet: built from source until CI pushes one, then pin
    # it like the others with `scripts/pin-images.sh` and drop the build block.
    image: ghcr.io/fardani235/webodm-plugin-runner:1@sha256:d34257dd401ad563ad3b0eb236b8bb26c7d90dc2d3053299574cb8ef65d70238
    build:
      context: ./services/plugin-runner
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SANDBOX_DIR: /sandbox
      PLUGIN_MAX_CONCURRENT_RUNS: "1"
      PLUGIN_MEMORY_MB: "2048"
      PLUGIN_DEFAULT_TIMEOUT: "300"
      PLUGIN_MAX_TIMEOUT: "3600"
    volumes:
      # The ONLY mount: the runner never sees frappe_sites or frappe_data, so a
      # plugin cannot read another organization's files. Frappe copies inputs in.
      - plugin_sandbox:/sandbox
    tmpfs:
      - /tmp:size=256m
    # Untrusted code runs here: no capabilities, no privilege escalation,
    # read-only image filesystem, bounded process count, and the internal-only
    # `sandbox` network (no route to the internet, DB, Redis, NodeODM or the
    # geospatial service). Only frappe-worker shares that network.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - sandbox
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5001/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
          pids: 256

  provisioner:
    # On-demand NodeODM compute (services/provisioner). Owns every cloud
    # credential and SDK; the app only ever sees this HTTP API. No published
    # image yet: built from source until CI pushes one, then pin it like the
    # others with `scripts/pin-images.sh` and drop the build block.
    image: ghcr.io/fardani235/webodm-provisioner:1
    build:
      context: ./services/provisioner
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # none | aws | fixed (dev only). See docs/on-demand-processing/configuration.md
      PROVISIONER_PROVIDER: ${PROVISIONER_PROVIDER:-none}
      PROVISIONER_API_TOKEN_FILE: /run/secrets/provisioner_api_token
      PROVISIONER_DEPLOYMENT: ${SITE_NAME:-webodm.local}
      PROVISIONER_NODEODM_PORT: ${PROVISIONER_NODEODM_PORT:-3000}
      PROVISIONER_NODEODM_IMAGE: ${PROVISIONER_NODEODM_IMAGE:-opendronemap/nodeodm:latest}
      PROVISIONER_NODEODM_ARGS: ${PROVISIONER_NODEODM_ARGS:-}
      PROVISIONER_MAX_LIFETIME_SECONDS: ${WEBODM_COMPUTE_MAX_LIFETIME_SECONDS:-43200}
      # AWS provider: every value explicit, none of them has a usable default.
      PROVISIONER_AWS_REGION: ${PROVISIONER_AWS_REGION:-}
      PROVISIONER_AWS_AMI_ID: ${PROVISIONER_AWS_AMI_ID:-}
      PROVISIONER_AWS_AMI_PREBAKED: ${PROVISIONER_AWS_AMI_PREBAKED:-false}
      PROVISIONER_AWS_INSTANCE_TYPES: ${PROVISIONER_AWS_INSTANCE_TYPES:-}
      PROVISIONER_AWS_HOURLY_COSTS: ${PROVISIONER_AWS_HOURLY_COSTS:-}
      PROVISIONER_AWS_DEFAULT_CLASS: ${PROVISIONER_AWS_DEFAULT_CLASS:-cpu}
      PROVISIONER_AWS_SUBNET_ID: ${PROVISIONER_AWS_SUBNET_ID:-}
      PROVISIONER_AWS_SECURITY_GROUP_IDS: ${PROVISIONER_AWS_SECURITY_GROUP_IDS:-}
      PROVISIONER_AWS_ROOT_VOLUME_GB: ${PROVISIONER_AWS_ROOT_VOLUME_GB:-200}
      PROVISIONER_AWS_KEY_NAME: ${PROVISIONER_AWS_KEY_NAME:-}
      PROVISIONER_AWS_IAM_INSTANCE_PROFILE: ${PROVISIONER_AWS_IAM_INSTANCE_PROFILE:-}
      AWS_ACCESS_KEY_ID_FILE: /run/secrets/aws_provisioner_access_key_id
      AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/aws_provisioner_secret_access_key
      # fixed provider (development): hand back the stack's own NodeODM.
      PROVISIONER_FIXED_ENDPOINT: ${PROVISIONER_FIXED_ENDPOINT:-nodeodm:3000}
    secrets:
      - provisioner_api_token
      - aws_provisioner_access_key_id
      - aws_provisioner_secret_access_key
    # Reachable from the backend network only (never published, never Caddy).
    # It needs egress to the cloud API and to the nodes' public endpoints for
    # readiness probes, so it lives on `backend`, not an internal network.
    networks:
      - backend
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5002/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  nodeodm:
    image: opendronemap/nodeodm:latest@sha256:cb07d06e21fd6189cfad287c6fedfa0b72568100355635cd9035cb86eed42ee2
    restart: unless-stopped
    volumes:
      - nodeodm_data:/var/www/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  backup:
    image: ghcr.io/fardani235/webodm-backup:1@sha256:28e3e09cd9308ed1ff2b052c17f45fefe8f5891ba02863c9ac938497cec68a9c
    # build:
    #   context: ./infra/backup
    restart: unless-stopped
    environment:
      SITE_NAME: ${SITE_NAME:-webodm.local}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 3 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
    volumes:
      - .:/host:ro
      - frappe_sites:/workspace/frappe-bench/sites:ro
      - frappe_data:/data:ro
      - backup_storage:/backups
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - backend
    depends_on:
      frappe-web:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  data:
    driver: bridge
    internal: true
  # frappe-worker <-> plugin-runner only; internal, so plugins have no egress.
  sandbox:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_cache_data:
  redis_queue_data:
  frappe_sites:
  frappe_logs:
  frappe_data:
  nodeodm_data:
  plugin_sandbox:
  geospatial_scratch:
  backup_storage:
  caddy_data:
  caddy_config:

secrets:
  db_password:
    file: ./secrets/db_password.txt
  admin_password:
    file: ./secrets/admin_password.txt
  redis_cache_password:
    file: ./secrets/redis_cache_password.txt
  redis_queue_password:
    file: ./secrets/redis_queue_password.txt
  frappe_admin_password:
    file: ./secrets/frappe_admin_password.txt
  # Object storage: two least-privilege identities for the same bucket
  # (app = writer/reader, geospatial = read + write COGs to assets/). Empty
  # files are fine when object storage is not configured or when the host
  # has an instance role.
  s3_app_access_key_id:
    file: ./secrets/s3_app_access_key_id.txt
  s3_app_secret_access_key:
    file: ./secrets/s3_app_secret_access_key.txt
  s3_geospatial_access_key_id:
    file: ./secrets/s3_geospatial_access_key_id.txt
  s3_geospatial_secret_access_key:
    file: ./secrets/s3_geospatial_secret_access_key.txt
  # On-demand compute: provisioning identity (EC2 only) and the shared token
  # the app presents to the provisioner API.
  aws_provisioner_access_key_id:
    file: ./secrets/aws_provisioner_access_key_id.txt
