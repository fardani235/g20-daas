apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "webodm.labels" (dict "ctx" . "component" "postgres") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "webodm.selectorLabels" (dict "ctx" . "component" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    {{- include "webodm.labels" (dict "ctx" . "component" "postgres") | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "webodm.selectorLabels" (dict "ctx" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "webodm.selectorLabels" (dict "ctx" . "component" "postgres") | nindent 8 }}
    spec:
      {{- include "webodm.podCommon" . | nindent 6 }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: {{ include "webodm.image" .Values.images.postgres }}
          imagePullPolicy: {{ .Values.images.postgres.pullPolicy }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.database.name | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.database.user | quote }}
            {{- include "webodm.secretEnv" (dict "ctx" . "name" "POSTGRES_PASSWORD" "key" "db_password") | nindent 12 }}
            # Read once by the init script, on an empty data directory.
            {{- include "webodm.secretEnv" (dict "ctx" . "name" "FRAPPE_ROOT_PASSWORD" "key" "frappe_admin_password") | nindent 12 }}
            - name: POSTGRES_INITDB_ARGS
              value: "--encoding=UTF8 --locale=C"
            # A subdirectory, so a volume root holding lost+found still initialises.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          # -h 127.0.0.1: the server only listens on TCP once initialisation
          # (including the init script) has finished.
          startupProbe:
            exec:
              command: [pg_isready, -h, 127.0.0.1, -U, {{ .Values.database.user | quote }}, -d, {{ .Values.database.name | quote }}]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [pg_isready, -h, 127.0.0.1, -U, {{ .Values.database.user | quote }}, -d, {{ .Values.database.name | quote }}]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: [pg_isready, -h, 127.0.0.1, -U, {{ .Values.database.user | quote }}, -d, {{ .Values.database.name | quote }}]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          {{- with .Values.postgres.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: scripts
              mountPath: /docker-entrypoint-initdb.d/init-frappe-admin.sh
              subPath: postgres-init.sh
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: webodm-scripts
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- include "webodm.storageClass" . | nindent 8 }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
