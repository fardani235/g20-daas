# Production overlay: real domain over TLS, external S3, pinned digests,
# resource requests, a LoadBalancer edge and a registry pull secret.
#
#   helm upgrade --install webodm infra/helm/webodm -n webodm \
#     -f infra/helm/webodm/values.prod.yaml -f my-site.yaml
#
# Everything marked CHANGE is site-specific: override it in your own values
# file rather than editing this one. See docs/deployment/kubernetes.md.

# kubernetes.io/dockerconfigjson secret for the private GHCR packages.
imagePullSecrets:
  - name: ghcr-pull

# "" = cluster default. CHANGE to a class with volume expansion and a Retain
# reclaim policy if the default lacks them.
storageClass: ""

site:
  domain: webodm.example.com          # CHANGE
  # Client IPs/CIDRs allowed to reach the Frappe Desk on admin.<domain>.
  # private_ranges fails closed: internet clients get 403 until you list yours.
  adminWhitelist: private_ranges      # CHANGE, e.g. "203.0.113.4 198.51.100.0/24"

# Credentials: an existing Secret, created out of band (kubectl, Sealed
# Secrets, your CI). Nothing secret is rendered by this chart.
secrets:
  name: webodm-secrets
  create: false

# Digests pinned to the same builds as docker-compose.yml. After
# scripts/pin-images.sh moves the compose pins, copy the new digests here.
images:
  frappe:
    tag: "16.34.0"
    digest: sha256:3ef1b3bbaa94baa93d13478f8c07d02306cfde12bd3fa4424ad251338257e592
  caddy:
    tag: "2"
    digest: sha256:1e0dc207983e2f1758f8f325d809967e51f2d5a9ea238a66775268efdda61052
  geospatial:
    tag: "1"
    digest: sha256:46c8640e4b288143e2753e0fbe0cb597c326ce3d7cd69cea7711ca0591a4b06a
  pluginRunner:
    tag: "1"
    digest: sha256:babb3ca2f5309e9e630bb2e66755cad791063ff218ee34a011e246858373f4cc
  provisioner:
    tag: "1"
    digest: sha256:887a24ba7252f2f137e2227de0361a6c0d426260ecd56e69865abbe2085c457b
  nodeodm:
    tag: latest
    digest: sha256:fcd99eb23d8db194a7d1dc95f029f518283b3d6be32dd64422395f4e7af56720
  postgres:
    tag: 16-3.4
    digest: sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
  redis:
    tag: 7-alpine
    digest: sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
  kubectl:
    tag: v1.34.1
    digest: sha256:59bafa07ff3a6d4b417e7633ddb9d79a9606ca98bf64bac080b3e65748669250

# External S3 through the same settings the dev MinIO uses; no MinIO here.
# Credentials: s3_app_* and s3_geospatial_* keys in the secret (two
# least-privilege identities, see infra/aws/iam), or leave those keys out and
# give the nodes/pods an IAM role.
minio:
  enabled: false
objectStorage:
  bucket: webodm-prod                 # CHANGE
  prefix: ""
  region: eu-central-1                # CHANGE
  endpointUrl: ""                     # empty = AWS S3
  forcePathStyle: false

# The shared claims (site config, serving cache, service data, plugin
# sandbox) are ReadWriteOnce, so the pods that mount them are kept on one
# node. Task inputs and outputs live in S3, not on these volumes. To spread
# those pods across nodes, use a ReadWriteMany class (EFS, Filestore, CephFS,
# NFS) for all three and set colocate: false.
persistence:
  colocate: true
  sites:
    size: 100Gi                       # >= objectStorage.cacheMaxBytes + headroom
    accessModes: [ReadWriteOnce]
  data:
    size: 50Gi
    accessModes: [ReadWriteOnce]
  sandbox:
    size: 20Gi
    accessModes: [ReadWriteOnce]

# The edge: Caddy behind a cloud load balancer, obtaining its own certificates
# (ports 80 and 443 must reach it from the internet; or set tls.dnsProvider).
caddy:
  tls:
    mode: auto
    email: ""                         # CHANGE (defaults to admin@<domain>)
  service:
    type: LoadBalancer
    # Local: the load balancer sends traffic only to the node running Caddy
    # and keeps the client source IP, which the admin whitelist checks.
    externalTrafficPolicy: Local
    annotations: {}
  # If your load balancer cannot preserve the source IP, turn on PROXY
  # protocol on both sides instead (a load balancer sending the header to a
  # Caddy that does not expect it breaks every connection):
  #   service:
  #     annotations:
  #       service.beta.kubernetes.io/aws-load-balancer-proxy-protocol: "*"
  #   proxyProtocol:
  #     enabled: true
  #     allow: ["10.0.0.0/8"]         # the load balancer's addresses
  proxyProtocol:
    enabled: false
  # Alternative edge: an Ingress in front of Caddy (TLS at the controller).
  #   tls: {mode: "off"}
  #   service: {type: ClusterIP}
  #   ingress: {enabled: true, className: nginx, tlsSecretName: webodm-tls}
  #   trustedProxies: ["10.244.0.0/16"]   # the controller's pod CIDR
  ingress:
    enabled: false
  persistence:
    enabled: true
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

postgres:
  persistence:
    size: 50Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi

redisCache:
  maxmemory: 512mb
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi

redisQueue:
  persistence:
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

bootstrap:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi

frappe:
  web:
    replicas: 2
    gunicornWorkers: 3
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        memory: 4Gi
  worker:
    replicas: 2
    terminationGracePeriodSeconds: 300
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        memory: 2Gi
  scheduler:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
  socketio:
    # Stateful across polling requests: one replica (the Service also pins
    # clients by IP should you raise this).
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 1Gi

geospatial:
  replicas: 1
  scratchSizeLimit: 50Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi

pluginRunner:
  enabled: true
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 3Gi

# On-demand EC2 compute stays outside the cluster; only its API runs here.
# With provider "aws", add the PROVISIONER_AWS_* settings under env
# (docs/on-demand-processing/configuration.md) and the aws_provisioner_* keys
# to the secret.
provisioner:
  enabled: true
  provider: none
  env: {}
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

# Static processing node. Size it for your datasets, or disable it when every
# task runs on provisioned nodes.
nodeodm:
  enabled: true
  persistence:
    size: 200Gi
  resources:
    requests:
      cpu: "2"
      memory: 8Gi

backup:
  enabled: true
  schedule: "0 3 * * *"
  retentionDays: 14
  persistence:
    size: 50Gi
  s3:
    bucket: ""                        # CHANGE to also copy backups off-cluster
    endpoint: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

networkPolicy:
  enabled: true
