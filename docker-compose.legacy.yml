services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: webodm
      POSTGRES_PASSWORD: ${DB_PASSWORD:-webodm}
      POSTGRES_DB: webodm
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webodm"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frappe:
    image: frappe/bench:v16
    platform: linux/amd64
    volumes:
      - assets:/assets
      - sites:/sites
      - data:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${WO_PORT:-8000}:8000"
    environment:
      - SITE_NAME=${SITE_NAME:-webodm.local}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-webodm}
      - DB_USER=${DB_USER:-webodm}
      - DB_PASSWORD=${DB_PASSWORD:-webodm}
      - REDIS_CACHE=redis://redis:6379
      - REDIS_QUEUE=redis://redis:6379
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
    command: >
      sh -c "
        wait-for-it db:5432 -t 60 &&
        wait-for-it redis:6379 -t 60 &&
        bench set-mariadb-host db &&
        bench new-site $SITE_NAME --force --db-type postgres --db-host db --db-name $DB_NAME --db-user $DB_USER --db-password $DB_PASSWORD --admin-password $ADMIN_PASSWORD &&
        bench --site $SITE_NAME install-app webodm_core &&
        bench --site $SITE_NAME install-app webodm_frontend &&
        bench start
      "
    restart: unless-stopped

  worker:
    image: frappe/bench:v16
    platform: linux/amd64
    volumes:
      - assets:/assets
      - sites:/sites
      - data:/data
    depends_on:
      frappe:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - SITE_NAME=${SITE_NAME:-webodm.local}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-webodm}
      - DB_USER=${DB_USER:-webodm}
      - DB_PASSWORD=${DB_PASSWORD:-webodm}
      - REDIS_CACHE=redis://redis:6379
      - REDIS_QUEUE=redis://redis:6379
    command: >
      sh -c "
        wait-for-it frappe:8000 -t 120 &&
        bench --site $SITE_NAME worker
      "
    restart: unless-stopped

  scheduler:
    image: frappe/bench:v16
    platform: linux/amd64
    volumes:
      - assets:/assets
      - sites:/sites
    depends_on:
      frappe:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - SITE_NAME=${SITE_NAME:-webodm.local}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-webodm}
      - DB_USER=${DB_USER:-webodm}
      - DB_PASSWORD=${DB_PASSWORD:-webodm}
      - REDIS_CACHE=redis://redis:6379
      - REDIS_QUEUE=redis://redis:6379
    command: >
      sh -c "
        wait-for-it frappe:8000 -t 120 &&
        bench --site $SITE_NAME schedule
      "
    restart: unless-stopped

  geospatial:
    build:
      context: ../webodm-geospatial
      dockerfile: Dockerfile
    volumes:
      - data:/data
    depends_on:
      redis:
        condition: service_started
    ports:
      - "5000:5000"
    environment:
      - DATA_DIR=/data
      - REDIS_URL=redis://redis:6379
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  assets:
  sites:
  data:
