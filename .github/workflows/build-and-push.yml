name: Build & Push Docker Image

on:
  push:
    branches: [main, master]
    paths:
      - 'infra/**'
      - 'docker-compose.yml'
      - '.github/workflows/build-and-push.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/webodm-frappe

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Frappe version
        id: version
        run: |
          VERSION=$(grep 'FRAPPE_VERSION' docker-compose.yml | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          VERSION=${VERSION:-16.26.3}
          echo "frappe_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Clone apps into build context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.frappe_version }}
          CONTEXT=build-context/frappe-bench
          mkdir -p "$CONTEXT/apps" "$CONTEXT/sites"

          # Frappe core (upstream, pinned to version tag)
          git clone --depth 1 --branch "v${VERSION}" \
            https://github.com/frappe/frappe.git "$CONTEXT/apps/frappe"

          # Our custom apps (use GITHUB_TOKEN for private repo access)
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/fardani235/webodm-core.git" \
            "$CONTEXT/apps/webodm_core"
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/fardani235/webodm-frontend.git" \
            "$CONTEXT/apps/webodm_frontend"

          # Dockerfile + sites/apps.txt from monorepo
          cp frappe-bench/apps/Dockerfile "$CONTEXT/apps/"
          cp frappe-bench/sites/apps.txt "$CONTEXT/sites/"

          # infra/ for Dockerfile's COPY --from=root
          cp -r infra/ build-context/infra/

          echo "Build context assembled:"
          ls -la "$CONTEXT/apps/"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.frappe_version }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./build-context/frappe-bench/apps
          file: ./build-context/frappe-bench/apps/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-contexts: |
            sites=./build-context/frappe-bench/sites
            root=./build-context
