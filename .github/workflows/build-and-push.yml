name: Build & Push Docker Images

on:
  push:
    branches: [main, master]
    paths:
      - 'infra/**'
      - 'docker-compose.yml'
      - 'frappe-bench/apps/Dockerfile'
      - '.github/workflows/build-and-push.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build-frappe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Frappe version
        id: version
        run: |
          VERSION=$(grep 'FRAPPE_VERSION' docker-compose.yml | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          VERSION=${VERSION:-16.26.3}
          echo "frappe_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Clone apps into build context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.frappe_version }}
          CONTEXT=build-context/frappe-bench
          mkdir -p "$CONTEXT/apps" "$CONTEXT/sites"

          git clone --depth 1 --branch "v${VERSION}" \
            https://github.com/frappe/frappe.git "$CONTEXT/apps/frappe"

          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/fardani235/webodm-core.git" \
            "$CONTEXT/apps/webodm_core"
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/fardani235/webodm-frontend.git" \
            "$CONTEXT/apps/webodm_frontend"

          cp frappe-bench/apps/Dockerfile "$CONTEXT/apps/"
          cp frappe-bench/sites/apps.txt "$CONTEXT/sites/"
          cp -r infra/ build-context/infra/

      - name: Build and push webodm-frappe
        uses: docker/build-push-action@v6
        with:
          context: ./build-context/frappe-bench/apps
          file: ./build-context/frappe-bench/apps/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/webodm-frappe:${{ steps.version.outputs.frappe_version }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/webodm-frappe:latest
          cache-from: type=gha,scope=frappe
          cache-to: type=gha,mode=max,scope=frappe
          build-contexts: |
            sites=./build-context/frappe-bench/sites
            root=./build-context

  build-caddy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push webodm-caddy
        uses: docker/build-push-action@v6
        with:
          context: ./infra/caddy
          file: ./infra/caddy/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/webodm-caddy:2
            ${{ env.REGISTRY }}/${{ env.OWNER }}/webodm-caddy:latest
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,mode=max,scope=caddy

  build-backup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push webodm-backup
        uses: docker/build-push-action@v6
        with:
          context: ./infra/backup
          file: ./infra/backup/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/webodm-backup:1
            ${{ env.REGISTRY }}/${{ env.OWNER }}/webodm-backup:latest
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup

  build-geospatial:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone geospatial repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/fardani235/webodm-geospatial.git" /tmp/webodm-geospatial

      - name: Build and push webodm-geospatial
        uses: docker/build-push-action@v6
        with:
          context: /tmp/webodm-geospatial
          file: /tmp/webodm-geospatial/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/webodm-geospatial:1
            ${{ env.REGISTRY }}/${{ env.OWNER }}/webodm-geospatial:latest
          cache-from: type=gha,scope=geospatial
          cache-to: type=gha,mode=max,scope=geospatial
