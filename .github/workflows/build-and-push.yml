name: Test, Build & Push

# Every image push is gated on all three test suites (webodm_core inside the
# freshly built Frappe image, the Vue SPA, the geospatial service) plus a
# version-drift check. Pull requests run tests and builds but never push.

on:
  push:
    branches: [main, master]
    paths:
      - 'infra/**'
      - 'scripts/**'
      - 'docker-compose.yml'
      - '.gitmodules'
      - 'frappe-bench/apps/**'
      - 'frappe-bench/sites/apps.txt'
      - 'services/geospatial/**'
      - '.github/workflows/build-and-push.yml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  FRAPPE_IMAGE: ghcr.io/${{ github.repository_owner }}/webodm-frappe

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # -------------------------------------------------------------- metadata --
  meta:
    name: Resolve Frappe version
    runs-on: ubuntu-latest
    outputs:
      frappe_version: ${{ steps.v.outputs.frappe_version }}
      should_push: ${{ steps.v.outputs.should_push }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # shallow-fetches the pinned frappe commit
      - id: v
        run: |
          VERSION="$(scripts/frappe-version.sh)"
          echo "frappe_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "should_push=${{ github.event_name != 'pull_request' }}" >> "$GITHUB_OUTPUT"
          echo "Frappe version (from submodule pin): $VERSION"
      - name: docker-compose.yml must agree with the submodule pin
        run: scripts/check-frappe-version.sh

  # ------------------------------------------------------------------ tests --
  test-frontend:
    name: Test • Vue SPA (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frappe-bench/apps/webodm_frontend/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frappe-bench/apps/webodm_frontend/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test

  test-geospatial:
    name: Test • geospatial service (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/geospatial
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/geospatial/requirements.txt
      - name: System deps (ogr2ogr for vector export tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends gdal-bin
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  # --------------------------------------------------- frappe: build + test --
  build-frappe:
    name: Build Frappe image, test webodm_core
    runs-on: ubuntu-latest
    needs: [meta]
    permissions:
      contents: read
      packages: write
    env:
      FRAPPE_VERSION: ${{ needs.meta.outputs.frappe_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: docker/setup-buildx-action@v3

      - name: Assemble app build context
        run: |
          CONTEXT=build-context/frappe-bench
          mkdir -p "$CONTEXT/apps" "$CONTEXT/sites"
          # Frappe comes from the submodule checkout (the pinned commit), not a
          # second clone by tag -- one source of truth.
          rsync -a --exclude='.git' frappe-bench/apps/frappe/ "$CONTEXT/apps/frappe/"
          for app in webodm_core webodm_frontend; do
            rsync -a --exclude='node_modules' --exclude='__pycache__' --exclude='.pytest_cache' \
              "frappe-bench/apps/$app/" "$CONTEXT/apps/$app/"
          done
          cp frappe-bench/apps/Dockerfile frappe-bench/apps/.dockerignore "$CONTEXT/apps/"
          cp frappe-bench/sites/apps.txt "$CONTEXT/sites/"
          cp -r infra/ build-context/infra/

      - name: Build (load locally, no push yet)
        uses: docker/build-push-action@v6
        with:
          context: ./build-context/frappe-bench/apps
          file: ./build-context/frappe-bench/apps/Dockerfile
          load: true
          tags: webodm-frappe:ci
          cache-from: type=gha,scope=frappe
          cache-to: type=gha,mode=max,scope=frappe
          build-contexts: |
            sites=./build-context/frappe-bench/sites
            root=./build-context

      - name: Test • webodm_core (inside the built image)
        run: IMAGE=webodm-frappe:ci scripts/ci/test-frappe.sh

      - name: Log in to GHCR
        if: needs.meta.outputs.should_push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed only after this job's own tests AND the other two suites pass.
      - name: Wait for the other suites
        if: needs.meta.outputs.should_push == 'true'
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-regexp: '^Test • '
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15
          allowed-conclusions: success

      - name: Push webodm-frappe
        if: needs.meta.outputs.should_push == 'true'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./build-context/frappe-bench/apps
          file: ./build-context/frappe-bench/apps/Dockerfile
          push: true
          tags: |
            ${{ env.FRAPPE_IMAGE }}:${{ env.FRAPPE_VERSION }}
            ${{ env.FRAPPE_IMAGE }}:latest
          cache-from: type=gha,scope=frappe
          build-contexts: |
            sites=./build-context/frappe-bench/sites
            root=./build-context

      - name: Record digest
        if: needs.meta.outputs.should_push == 'true'
        run: |
          echo "### webodm-frappe" >> "$GITHUB_STEP_SUMMARY"
          echo '`'"${FRAPPE_IMAGE}:${FRAPPE_VERSION}@${{ steps.push.outputs.digest }}"'`' >> "$GITHUB_STEP_SUMMARY"
          echo "Pin it with: \`scripts/pin-images.sh frappe\`" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------ other images: build+push --
  build-images:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [meta, test-frontend, test-geospatial, build-frappe]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: webodm-caddy
            context: ./infra/caddy
            tag: "2"
          - name: webodm-backup
            context: ./infra/backup
            tag: "1"
          - name: webodm-geospatial
            context: ./services/geospatial
            tag: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: needs.meta.outputs.should_push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: ${{ needs.meta.outputs.should_push == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}:${{ matrix.tag }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Record digest
        if: needs.meta.outputs.should_push == 'true'
        run: |
          echo "### ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo '`'"${REGISTRY}/${OWNER}/${{ matrix.name }}:${{ matrix.tag }}@${{ steps.build.outputs.digest }}"'`' >> "$GITHUB_STEP_SUMMARY"
